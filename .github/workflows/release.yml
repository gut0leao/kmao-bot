name: Build release (manual)
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create an unpublished prerelease draft after building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: powershell
        run: |
          ./tests/Test-Core.ps1
          ./tests/Test-Updates.ps1
          ./tests/Test-Lifecycle.ps1
      - name: Prepare release signing keys
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.KMAO_RELEASE_KEY_BASE64 }}
          PUBLIC_KEY: ${{ secrets.KMAO_RELEASE_PUBLIC_KEY_BASE64 }}
        run: |
          if (!$env:PRIVATE_KEY -or !$env:PUBLIC_KEY) { throw 'Configure both KMAO signing secrets before building.' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/kmao-private.xml", [Convert]::FromBase64String($env:PRIVATE_KEY))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/kmao-public.xml", [Convert]::FromBase64String($env:PUBLIC_KEY))
      - name: Build signed packages and installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is required on the Windows runner.' }
          ./scripts/Build-KmaoRelease.ps1 -PrivateKeyPath "$env:RUNNER_TEMP/kmao-private.xml" -PublicKeyPath "$env:RUNNER_TEMP/kmao-public.xml" -IsccPath $iscc
      - uses: actions/upload-artifact@v4
        with:
          name: kmao-release
          path: |
            dist/release/kmao-*.zip
            dist/release/kmao-setup-*.exe
            dist/release/kmao-manifest.json
            dist/release/kmao-manifest.sig
      - name: Create unpublished draft
        if: inputs.create_draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "v$version" --draft --prerelease --target $env:GITHUB_SHA --title "KMAO $version (testes)" --notes-file CHANGELOG.md dist/release/kmao-*.zip dist/release/kmao-setup-*.exe dist/release/kmao-manifest.json dist/release/kmao-manifest.sig
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
      - name: Remove temporary signing keys
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/kmao-private.xml", "$env:RUNNER_TEMP/kmao-public.xml" -Force -ErrorAction SilentlyContinue

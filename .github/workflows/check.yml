name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: WSL bridge argument handling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/kmao.sh
          python3 tests/test_wsl_bridge.py
          python3 tests/test_publish_release.py
      - name: Core and update tests
        shell: pwsh
        run: |
          ./tests/Test-Core.ps1
          ./tests/Test-Configuration.ps1
          ./tests/Test-Updates.ps1
          ./tests/Test-Authenticode.ps1
          ./tests/Test-BotHost.ps1
          ./tests/Test-Lifecycle.ps1
          ./tests/Test-Desktop.ps1
      - name: Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/Test-Core.ps1
          ./tests/Test-Configuration.ps1
          ./tests/Test-Updates.ps1
          ./tests/Test-Authenticode.ps1
          ./tests/Test-BotHost.ps1
          ./tests/Test-Lifecycle.ps1
          ./tests/Test-Desktop.ps1
